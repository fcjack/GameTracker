{{define "library/game_grid"}}
{{if not .games}}
<div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">
    <p class="text-4xl mb-3">📭</p>
    <p class="font-semibold text-gray-200">No games yet</p>
    <p class="mt-1 text-sm text-gray-500">
        Search for a game above and click "Add to Library".
    </p>
</div>
{{else}}
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    {{range .games}}
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden
                flex flex-col" id="library-game-{{.GameID}}">

        {{if .CoverURL}}
        <img src="{{.CoverURL}}" alt="{{.Name}}"
             class="w-full aspect-[3/4] object-cover bg-gray-800">
        {{else}}
        <div class="w-full aspect-[3/4] bg-gray-800 flex items-center
                    justify-center">
            <i class="fas fa-gamepad text-4xl text-gray-600"></i>
        </div>
        {{end}}

        <div class="p-3 flex flex-col gap-2 flex-1">
            <p class="text-sm font-medium leading-tight line-clamp-2"
               title="{{.Name}}">{{.Name}}</p>

            {{if .ReleaseYear}}
            <p class="text-xs text-gray-500">{{.ReleaseYear}}</p>
            {{end}}

            <div id="status-{{.GameID}}" class="mt-auto">
                <select
                    name="status"
                    hx-post="/library/games/{{.GameID}}/status"
                    hx-target="#status-{{.GameID}}"
                    hx-swap="outerHTML"
                    hx-trigger="change"
                    class="w-full text-xs bg-gray-800 border border-gray-700
                           rounded px-2 py-1 text-white focus:outline-none
                           focus:border-indigo-500 cursor-pointer">
                    <option value="owned"     {{if eq .Status "owned"}}selected{{end}}>Owned</option>
                    <option value="playing"   {{if eq .Status "playing"}}selected{{end}}>Playing</option>
                    <option value="completed" {{if eq .Status "completed"}}selected{{end}}>Completed</option>
                    <option value="dropped"   {{if eq .Status "dropped"}}selected{{end}}>Dropped</option>
                </select>
            </div>

            <button
                hx-delete="/library/games/{{.GameID}}"
                hx-target="#library-game-{{.GameID}}"
                hx-swap="outerHTML"
                hx-confirm="Remove {{.Name}} from your library?"
                class="w-full text-xs text-gray-500 hover:text-red-400
                       transition-colors py-1">
                <i class="fas fa-trash-alt mr-1"></i> Remove
            </button>
        </div>
    </div>
    {{end}}
</div>
{{end}}
{{end}}
