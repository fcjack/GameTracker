{{define "library/group_by_control"}}
{{$gridURL := "/library/games"}}{{if .libraryGridURL}}{{$gridURL = .libraryGridURL}}{{end}}
<div class="flex flex-col gap-1.5 sm:items-end">
    <span class="text-sm text-gray-400">{{call .T "library.group_by"}}</span>
    <div class="inline-flex rounded-lg border border-gray-700 bg-gray-800 p-1"
         role="group" aria-label="{{call .T "library.group_by"}}">
        <label class="cursor-pointer rounded-md px-3 py-1.5 text-sm text-gray-300
                      transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
            <input type="radio" name="group_by" value="" class="sr-only" checked
                   hx-get="{{$gridURL}}"
                   hx-target="#library-section"
                   hx-trigger="change"
                   hx-include="[name='group_by']:checked">
            {{call .T "library.all_games"}}
        </label>
        <label class="cursor-pointer rounded-md px-3 py-1.5 text-sm text-gray-300
                      transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
            <input type="radio" name="group_by" value="platform" class="sr-only"
                   hx-get="{{$gridURL}}"
                   hx-target="#library-section"
                   hx-trigger="change"
                   hx-include="[name='group_by']:checked">
            {{call .T "library.group_platform"}}
        </label>
        <label class="cursor-pointer rounded-md px-3 py-1.5 text-sm text-gray-300
                      transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
            <input type="radio" name="group_by" value="year" class="sr-only"
                   hx-get="{{$gridURL}}"
                   hx-target="#library-section"
                   hx-trigger="change"
                   hx-include="[name='group_by']:checked">
            {{call .T "library.group_year"}}
        </label>
    </div>
</div>
{{end}}
