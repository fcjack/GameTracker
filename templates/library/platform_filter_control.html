{{define "library/platform_filter_control"}}
{{if gt (len .platforms) 1}}
{{$gridURL := "/library/games"}}{{if .libraryGridURL}}{{$gridURL = .libraryGridURL}}{{end}}
<div class="flex flex-col gap-1.5 sm:items-end">
    <span class="text-sm text-gray-400">{{call .T "library.filter_by"}}</span>
    <div class="inline-flex flex-wrap justify-end gap-1 rounded-lg border border-gray-700 bg-gray-800 p-1"
         role="group" aria-label="{{call .T "library.filter_by"}}">
        <label class="cursor-pointer rounded-md px-3 py-1.5 text-sm text-gray-300
                      transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
            <input type="radio" name="platform" value="" class="sr-only" checked
                   hx-get="{{$gridURL}}"
                   hx-target="#library-section"
                   hx-trigger="change"
                   hx-include="[name='group_by']:checked, [name='platform']:checked">
            {{call .T "library.all_platforms"}}
        </label>
        {{range .platforms}}
        <label class="cursor-pointer rounded-md px-3 py-1.5 text-sm text-gray-300
                      transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
            <input type="radio" name="platform" value="{{.}}" class="sr-only"
                   hx-get="{{$gridURL}}"
                   hx-target="#library-section"
                   hx-trigger="change"
                   hx-include="[name='group_by']:checked, [name='platform']:checked">
            {{.}}
        </label>
        {{end}}
    </div>
</div>
{{end}}
{{end}}
