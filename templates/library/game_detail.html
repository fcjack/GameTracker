{{define "library/game_detail"}}
<!DOCTYPE html>
<html lang="{{.lang}}" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.card.Name}} — {{call .T "app.name"}}</title>
    {{template "layout/pwa_head" .}}
    <link rel="stylesheet" href="/static/css/app.css?v={{.version}}">
    <script src="/static/js/htmx.min.js?v={{.version}}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-950 text-white">
    {{template "layout/app_start" .}}

    <main class="max-w-4xl mx-auto px-4 py-10 w-full"
          data-page-title="{{.card.Name}} — {{call .T "app.name"}}">
        <a href="/library"
           hx-boost="true"
           hx-target="#app-shell"
           hx-select="#app-shell"
           hx-swap="outerHTML show:window:top"
           class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors mb-6">
            <i class="fas fa-arrow-left"></i>
            {{call .T "game.back_to_library"}}
        </a>

        {{template "library/game_detail_content" .card}}
    </main>

    {{template "layout/app_end" .}}
</body>
</html>
{{end}}
