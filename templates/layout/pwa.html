{{define "layout/pwa_register"}}
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .catch(function (err) { console.warn('Service worker registration failed:', err); });
    }
</script>
{{end}}
