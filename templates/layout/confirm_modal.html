{{define "layout/confirm_modal"}}
<div id="confirm-modal"
     class="hidden fixed inset-0 flex items-end sm:items-center justify-center p-4"
     role="dialog"
     aria-modal="true"
     aria-labelledby="confirm-modal-message">
    <div class="absolute inset-0 bg-black/60"
         onclick="closeConfirmDialog()"
         aria-hidden="true"></div>
    <div class="relative w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl
                shadow-2xl shadow-black/40 p-6">
        <p id="confirm-modal-message"
           class="text-sm text-gray-200 leading-relaxed whitespace-pre-wrap"></p>
        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3 mt-6">
            <button type="button"
                    id="confirm-modal-cancel"
                    onclick="closeConfirmDialog()"
                    class="w-full sm:w-auto px-4 py-2.5 text-sm font-medium rounded-lg
                           bg-gray-800 border border-gray-700 text-gray-200
                           hover:bg-gray-700 transition-colors">
                {{call .T "game.cancel"}}
            </button>
            <button type="button"
                    id="confirm-modal-accept"
                    onclick="acceptConfirmDialog()"
                    class="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold rounded-lg
                           bg-red-600 hover:bg-red-500 text-white transition-colors">
                {{call .T "game.confirm"}}
            </button>
        </div>
    </div>
</div>
{{end}}
