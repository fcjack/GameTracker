{{define "dashboard/stats"}}
<div id="dashboard-stats"
     hx-get="/dashboard/stats"
     hx-trigger="libraryUpdated from:body"
     hx-include="[name='year']"
     hx-swap="outerHTML"
     class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5 mb-10">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <p class="text-3xl font-bold">{{index .stats "Playing"}}</p>
        <p class="mt-1 text-sm text-gray-400">Playing</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <p class="text-3xl font-bold">{{index .stats "Completed"}}</p>
        <p class="mt-1 text-sm text-gray-400">Completed</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <p class="text-3xl font-bold">{{index .stats "CompletedInYear"}}</p>
        <label class="mt-1 flex items-center gap-1.5 text-sm text-gray-400">
            <span>Finished in</span>
            <select name="year"
                    class="bg-gray-800 border border-gray-700 rounded px-1.5 py-0.5
                           text-white text-sm focus:outline-none focus:border-indigo-500"
                    hx-get="/dashboard/stats"
                    hx-target="#dashboard-stats"
                    hx-trigger="change"
                    hx-include="[name='year']">
                {{range .years}}
                <option value="{{.}}" {{if eq . $.year}}selected{{end}}>{{.}}</option>
                {{end}}
            </select>
        </label>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <p class="text-3xl font-bold">{{index .stats "Backlog"}}</p>
        <p class="mt-1 text-sm text-gray-400">Backlog</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <p class="text-3xl font-bold">{{index .stats "Dropped"}}</p>
        <p class="mt-1 text-sm text-gray-400">Dropped</p>
    </div>
</div>
{{end}}
