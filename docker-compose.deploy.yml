# Production deployment (homelab) — use with: docker compose -f docker-compose.deploy.yml up -d
# Copy .env.deploy.example to .env and fill in secrets before starting.
#
# HTTPS and local DNS are handled by Traefik on the host. External access uses a
# Cloudflare Tunnel (cloudflared). Configure the tunnel's public hostname in the
# Cloudflare Zero Trust dashboard to point at your Traefik entrypoint or directly
# at http://app:8080 on the game-tracker network.

name: game-tracker-deploy

services:
  app:
    image: ${APP_IMAGE:-docker.io/jackcoelho/game-tracker:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      APP_PORT: "8080"
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      XBOX_CLIENT_ID: ${XBOX_CLIENT_ID:-}
      XBOX_CLIENT_SECRET: ${XBOX_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      IGDB_BASE_URL: ${IGDB_BASE_URL:-https://api.igdb.com/v4}
      SIGN_IN_ENABLED: ${SIGN_IN_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - game-tracker
      - traefik

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - game-tracker

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - game-tracker
      - traefik

networks:
  game-tracker:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  postgres_data:
