# Local development — hot-reloads templates/static via bind mounts.
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Use the compose service name; .env keeps localhost for host-side `go run`.
      - DATABASE_URL=postgres://gametracker:gametracker@db:5432/gametracker
      - STEAM_API_KEY=${STEAM_API_KEY}
      - XBOX_CLIENT_ID=${XBOX_CLIENT_ID}
      - XBOX_CLIENT_SECRET=${XBOX_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - IGDB_BASE_URL=${IGDB_BASE_URL}
      - SIGN_IN_ENABLED=${SIGN_IN_ENABLED:-true}
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gametracker
      - POSTGRES_PASSWORD=gametracker
      - POSTGRES_DB=gametracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: