name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        run: go build -v -o game-tracker cmd/main.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: docker.io
      IMAGE_REPOSITORY: jackcoelho/game-tracker
    steps:
      - uses: actions/checkout@v6

      - name: Set image name
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_NAME=${REGISTRY}/${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_NAME=game-tracker" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare Docker Hub token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAW_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::DOCKER_PASSWORD secret is missing. Add a Docker Hub access token to repository secrets."
            exit 1
          fi
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "::add-mask::${TOKEN}"
          echo "DOCKER_PASSWORD=${TOKEN}" >> "$GITHUB_ENV"

      - name: Validate Docker Hub credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_PASSWORD: ${{ env.DOCKER_PASSWORD }}
        run: |
          http_code="$(curl -s -o /tmp/docker-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"jackcoelho\",\"password\":\"${DOCKER_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/)"
          if [ "$http_code" != "200" ]; then
            echo "::error::Docker Hub rejected the token (HTTP ${http_code}). Create a new access token at https://hub.docker.com/settings/security with Read & Write permissions, then update the DOCKER_PASSWORD secret."
            cat /tmp/docker-login.json
            exit 1
          fi
          echo "Docker Hub credentials validated."

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: jackcoelho
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
